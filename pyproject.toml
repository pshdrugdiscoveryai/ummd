[project]
name = "ummd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "pytest>=8.0",
    "seaborn>=0.13.2",
    "memory-profiler>=0.61.0",
    "tqdm>=4.67.3",
    "ipywidgets>=8.0",
    "ruff>=0.15.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
